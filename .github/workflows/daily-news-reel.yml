name: Daily news reel

on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC = 09:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only make the video (download it from Artifacts), do not post'
        type: boolean
        default: true
      post_url:
        description: 'Optional: one specific post URL to use'
        required: false

permissions:
  contents: write

concurrency:
  group: reel-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg fonts-noto-core
          echo "FONT_FILE=$(fc-match -f '%{file}' 'Noto Sans:bold')" >> $GITHUB_ENV

      - name: Make video and post
        env:
          DATA_DIR: ./state
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_FALLBACK_URL: ${{ vars.IG_FALLBACK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_LIST_URL: ${{ vars.JOB_LIST_URL }}
          JOB_LINK_SELECTOR: ${{ vars.JOB_LINK_SELECTOR }}
          NEWS_HOME_URL: ${{ vars.NEWS_HOME_URL }}
          POST_URL: ${{ inputs.post_url }}
        run: node src/main.js news ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry' || '' }}

      - name: Keep the video for 3 days (check it under Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Save posted history
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "Update posted history" && git pull --rebase && git push)
